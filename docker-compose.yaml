services:

  user-postgres:
    image: postgres:17
    container_name: fooddelivery-user-db
    ports:
      - "5431:5432"
    environment:
      POSTGRES_DB: talabatdb-users
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - user-pgdata:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d talabatdb-users" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  restaurant-postgres:
    image: postgres:17
    container_name: fooddelivery-restaurant-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: talabatdb-restaurants
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - restaurant-pgdata:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d talabatdb-restaurants" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  order-postgres:
    image: postgres:17
    container_name: fooddelivery-order-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: talabatdb-orders
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - order-pgdata:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d talabatdb-orders" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  delivery-postgres:
    image: postgres:17
    container_name: fooddelivery-delivery-db
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: talabatdb-deliveries
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - delivery-pgdata:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d talabatdb-deliveries" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  checkout-postgres:
    image: postgres:17
    container_name: fooddelivery-checkout-db
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: talabatdb-checkout
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - checkout-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d talabatdb-checkout"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mongo:
    image: mongo:latest
    container_name: fooddelivery-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpass
      MONGO_INITDB_DATABASE: fooddeliverymongo
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    container_name: fooddelivery-redis
    ports:
      - "6379:6379"
    command: >
      redis-server
      --requirepass redispass
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "redispass", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: elasticsearch:9.0.3
    container_name: fooddelivery-elasticsearch
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  neo4j:
    image: neo4j:latest
    container_name: fooddelivery-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/neo4jpass
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_heap_initial__size: 256m
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: [ "CMD", "neo4j", "status" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  cassandra:
    image: cassandra:latest
    container_name: fooddelivery-cassandra
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: fooddeliverycluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_KEYSPACE: fooddeliveryks
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
      JVM_OPTS: "-Xms512m -Xmx512m -XX:MaxDirectMemorySize=512m"

    volumes:
      - cassandra-data:/var/lib/cassandra
    command: >
      bash -c "
        docker-entrypoint.sh cassandra -f &
        until cqlsh -e 'DESCRIBE KEYSPACES' 2>/dev/null; do sleep 5; done;
        cqlsh -e \"CREATE KEYSPACE IF NOT EXISTS $${CASSANDRA_KEYSPACE} WITH replication = {'class':'SimpleStrategy','replication_factor':1};\";
        wait
      "
    healthcheck:
      test: [ "CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES'" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  pgadmin:
    build:
      context: .
      dockerfile: pgadmin.Dockerfile
    container_name: fooddelivery-pgadmin
    ports:
      - "9090:80"
    depends_on:
      - user-postgres
      - restaurant-postgres
      - order-postgres
      - delivery-postgres
      - checkout-postgres
    restart: on-failure
    volumes:
      - pgadmin-data:/var/lib/pgadmin

  mongo-express:
    image: mongo-express:latest
    container_name: fooddelivery-mongo-ui
    ports:
      - "27018:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: rootpass
      ME_CONFIG_MONGODB_URL: mongodb://root:rootpass@mongo:27017/
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      mongo:
        condition: service_healthy

  redisinsight:
    image: redis/redisinsight:latest
    container_name: fooddelivery-redis-ui
    ports:
      - "5540:5540"
    depends_on:
      - redis

  kibana:
    image: kibana:9.0.3
    container_name: fooddelivery-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3-management
    container_name: fooddelivery-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  loki:
    image: grafana/loki:2.9.4
    container_name: fooddelivery-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: "wget -q -O - http://localhost:3100/ready || exit 1"
      interval: 10s
      retries: 5

  grafana:
    image: grafana/grafana:10.4.2
    container_name: fooddelivery-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      loki:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: fooddelivery-prometheus
    ports:
      - "9095:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=24h'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: "wget -q -O - http://localhost:9090/-/ready || exit 1"
      interval: 10s
      retries: 5

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: fooddelivery-user-service
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-postgres:5432/talabatdb-users
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
    depends_on:
      user-postgres:
        condition: service_healthy

  restaurant-service:
    build:
      context: ./restaurant-service
      dockerfile: Dockerfile
    container_name: fooddelivery-restaurant-service
    ports:
      - "8082:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://restaurant-postgres:5432/talabatdb-restaurants
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      restaurant-postgres:
        condition: service_healthy

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: fooddelivery-order-service
    ports:
      - "8083:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://order-postgres:5432/talabatdb-orders
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_MONGODB_URI: mongodb://root:rootpass@mongo:27017/fooddeliverymongo?authSource=admin
      SPRING_NEO4J_URI: bolt://neo4j:7687
      JWT_SECRET: ${JWT_SECRET}
      FEIGN_USER-SERVICE_URL: http://user-service:8080
      FEIGN_RESTAURANT-SERVICE_URL: http://restaurant-service:8080
      FEIGN_DELIVERY-SERVICE_URL: http://delivery-service:8080
      FEIGN_CHECKOUT-SERVICE_URL: http://checkout-service:8080
    depends_on:
      order-postgres:
        condition: service_healthy

  delivery-service:
    build:
      context: ./delivery-service
      dockerfile: Dockerfile
    container_name: fooddelivery-delivery-service
    ports:
      - "8084:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://delivery-postgres:5432/talabatdb-deliveries
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      delivery-postgres:
        condition: service_healthy
    entrypoint: [ "sh", "-c", "sleep 90 && exec java -jar app.jar" ]

  checkout-service:
    build:
      context: ./checkout-service
      dockerfile: Dockerfile
    container_name: fooddelivery-checkout-service
    ports:
      - "8085:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://checkout-postgres:5432/talabatdb-checkout
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET}
      FEIGN_USER-SERVICE_URL: http://user-service:8080
      FEIGN_ORDER-SERVICE_URL: http://order-service:8080
      FEIGN_RESTAURANT-SERVICE_URL: http://restaurant-service:8080
    depends_on:
      checkout-postgres:
        condition: service_healthy

volumes:
    pgadmin-data:
    mongo-data:
    es-data:
    neo4j-data:
    cassandra-data:
    user-pgdata:
    restaurant-pgdata:
    order-pgdata:
    delivery-pgdata:
    checkout-pgdata:


