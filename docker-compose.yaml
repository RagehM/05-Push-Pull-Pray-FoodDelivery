services:
  postgres:
    build:
      context: .
      dockerfile: postgres.Dockerfile
    container_name: fooddelivery-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: fooddeliverydb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  pgadmin:
    build:
      context: .
      dockerfile: pgadmin.Dockerfile
    container_name: fooddelivery-pgadmin
    ports:
      - "9090:80"
    depends_on:
      - postgres
    restart: on-failure

volumes:
    pgdata: