name: CI/CD Pipeline

on:
  push:
    branches:
      - "feat/**"
      - main

jobs:
  build-and-test:
    name: Maven Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      - name: Build & run tests
        run: mvn -B clean install -DskipTests

      - name: List user-service/target contents
        run: |
          ls -l user-service/target

      - name: List all target directories
        run: |
          find . -type d -name target

      - name: List all JARs
        run: |
          find . -name "*.jar"

  docker-build:
    name: Docker Build (feat only)
    runs-on: ubuntu-latest
    needs: build-and-test
    if: startsWith(github.ref, 'refs/heads/feat/')

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            context: .
            dockerfile: api-gateway/Dockerfile
          - service: user-service
            context: .
            dockerfile: user-service/Dockerfile
          - service: restaurant-service
            context: .
            dockerfile: restaurant-service/Dockerfile
          - service: order-service
            context: .
            dockerfile: order-service/Dockerfile
          - service: delivery-service
            context: .
            dockerfile: delivery-service/Dockerfile
          - service: checkout-service
            context: .
            dockerfile: checkout-service/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: List build context before Docker build
        run: |
          ls -l
          ls -l user-service
          ls -l user-service/target
          ls -l restaurant-service
          ls -l restaurant-service/target
          ls -l order-service
          ls -l order-service/target
          ls -l delivery-service
          ls -l delivery-service/target
          ls -l checkout-service
          ls -l checkout-service/target
          ls -l api-gateway
          ls -l api-gateway/target

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          tags: |
            local/${{ matrix.service }}:latest

  docker-push:
    name: Docker Push (main only)
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            context: .
            dockerfile: api-gateway/Dockerfile
          - service: user-service
            context: .
            dockerfile: user-service/Dockerfile
          - service: restaurant-service
            context: .
            dockerfile: restaurant-service/Dockerfile
          - service: order-service
            context: .
            dockerfile: order-service/Dockerfile
          - service: delivery-service
            context: .
            dockerfile: delivery-service/Dockerfile
          - service: checkout-service
            context: .
            dockerfile: checkout-service/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase owner
        id: vars
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/fooddelivery-${{ matrix.service }}:latest
            ghcr.io/${{ steps.vars.outputs.owner }}/fooddelivery-${{ matrix.service }}:${{ github.sha }}