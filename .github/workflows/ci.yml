name: CI/CD Pipeline

on:
  push:
    branches:
      - "feat/**"
      - main

jobs:
  build-and-test:
    name: Maven Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      - name: Build all modules & run JUnit tests
        run: mvn -B package --file pom.xml

      - name: Upload Surefire test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/*.xml"
          retention-days: 7

      - name: Upload service JARs
        uses: actions/upload-artifact@v4
        with:
          name: service-jars
          retention-days: 1
          path: |
            user-service/target/*.jar
            !user-service/target/*-plain.jar
            restaurant-service/target/*.jar
            !restaurant-service/target/*-plain.jar
            order-service/target/*.jar
            !order-service/target/*-plain.jar
            delivery-service/target/*.jar
            !delivery-service/target/*-plain.jar
            checkout-service/target/*.jar
            !checkout-service/target/*-plain.jar

  docker:
    name: Docker – ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: build-and-test

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            context: .
            dockerfile: api-gateway/Dockerfile

          - service: user-service
            context: user-service
            dockerfile: user-service/Dockerfile

          - service: restaurant-service
            context: restaurant-service
            dockerfile: restaurant-service/Dockerfile

          - service: order-service
            context: order-service
            dockerfile: order-service/Dockerfile

          - service: delivery-service
            context: delivery-service
            dockerfile: delivery-service/Dockerfile

          - service: checkout-service
            context: checkout-service
            dockerfile: checkout-service/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download pre-built service JARs
        uses: actions/download-artifact@v4
        with:
          name: service-jars

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/fooddelivery-${{ matrix.service }}:latest
            ghcr.io/${{ github.repository_owner }}/fooddelivery-${{ matrix.service }}:${{ github.sha }}

