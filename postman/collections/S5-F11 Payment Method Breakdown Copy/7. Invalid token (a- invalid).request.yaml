$kind: http-request
name: "7. Invalid token (a: invalid)"
url: "{{baseUrl}}/api/payments/analytics/methods?startDate={{today}}&endDate={{today}}"
method: GET
headers:
  Authorization: Bearer not.a.valid.token
queryParams:
  startDate: "{{today}}"
  endDate: "{{today}}"
scripts:
  - type: afterResponse
    code: pm.test('401 Unauthorized', () => pm.response.to.have.status(401));
    language: text/javascript
order: 7000
