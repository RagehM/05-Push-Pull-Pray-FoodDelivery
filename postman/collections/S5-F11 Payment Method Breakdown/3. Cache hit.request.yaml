$kind: http-request
url: "{{baseUrl}}/api/payments/analytics/methods?startDate={{today}}&endDate={{today}}"
method: GET
headers:
  Authorization: Bearer {{token}}
queryParams:
  startDate: "{{today}}"
  endDate: "{{today}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('Fast (<300ms)', () => pm.expect(pm.response.responseTime).to.be.below(300));
    language: text/javascript
order: 3000
