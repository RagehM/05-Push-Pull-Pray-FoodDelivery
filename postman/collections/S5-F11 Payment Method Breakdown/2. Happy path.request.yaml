$kind: http-request
url: "{{baseUrl}}/api/payments/analytics/methods?startDate={{today}}&endDate={{today}}"
method: GET
headers:
  Authorization: Bearer {{token}}
queryParams:
  startDate: "{{today}}"
  endDate: "{{today}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      const data = pm.response.json();
      const cc  = data.find(d => d.method === 'CREDIT_CARD');
      const cod = data.find(d => d.method === 'CASH_ON_DELIVERY');
      pm.test('CREDIT_CARD aggregates', () => {
        pm.expect(cc.successCount).to.eql(5);
        pm.expect(cc.failureCount).to.eql(2);
        pm.expect(cc.totalAmount).to.eql(500);
        pm.expect(cc.successRate).to.be.closeTo(5/7, 1e-9);
      });
      pm.test('CASH_ON_DELIVERY aggregates', () => {
        pm.expect(cod.successCount).to.eql(3);
        pm.expect(cod.failureCount).to.eql(0);
        pm.expect(cod.totalAmount).to.eql(300);
        pm.expect(cod.successRate).to.eql(1);
      });
      pm.test('Excluded actions ignored', () => {
        const total = data.reduce((s,d) => s + d.successCount + d.failureCount, 0);
        pm.expect(total).to.eql(10);
      });
    language: text/javascript
order: 2000
