apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: talabat
  labels:
    app: elasticsearch
    feature: S5-INFRA
spec:
  clusterIP: None
  selector:
    app: elasticsearch
  ports:
    - name: http
      port: 9200
      targetPort: 9200
    - name: transport
      port: 9300
      targetPort: 9300
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch-rw
  namespace: talabat
  labels:
    app: elasticsearch
    feature: S5-INFRA
spec:
  type: ClusterIP
  selector:
    app: elasticsearch
  ports:
    - name: http
      port: 9200
      targetPort: 9200
    - name: transport
      port: 9300
      targetPort: 9300