apiVersion: apps/v1
kind: Deployment
metadata:
  name: delivery-service
  namespace: talabat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: delivery-service
  template:
    metadata:
      labels:
        app: delivery-service
    spec:
      initContainers:
      - name: create-keyspace
        image: cassandra:latest
        command:
          - cqlsh
          - cassandra
          - "9042"
          - -e
          - "CREATE KEYSPACE IF NOT EXISTS fooddeliveryks WITH replication = {'class': 'SimpleStrategy', 'replication_factor': 1};"
      containers:
        - name: delivery-service
          image: 05-push-pull-pray-fooddelivery-delivery-service:latest
          imagePullPolicy: Never # Using local image, use "minikube image load 05-push-pull-pray-fooddelivery-delivery-service:0.0.1-SNAPSHOT"
          command: ["sh", "-c", "java -Dlogging.level.root=DEBUG -jar app.jar 2>&1"]
          ports:
            - containerPort: 8080
          # resources:
          #   requests:
          #     cpu: 100m
          #     memory: 256Mi
          #     ephemeral-storage: 1Gi
          #   limits:
          #     cpu: 500m
          #     memory: 512Mi
          #     ephemeral-storage: 2Gi
          envFrom:
            - configMapRef:
                name: delivery-service-configmap
            - secretRef:
                name: delivery-postgres-secret
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: jwt-secret
            - name: JWT_EXPIRATION
              value: "86400000"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
