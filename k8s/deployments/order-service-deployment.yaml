apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: talabat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: 05-push-pull-pray-fooddelivery-order-service:latest
          imagePullPolicy: Never # Using local image, use "minikube image load 05-push-pull-pray-fooddelivery-order-service:latest"
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: order-service-configmap
            - secretRef:
                name: order-postgres-secret
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: jwt-secret
          readinessProbe:
            httpGet:
              path: /api/orders/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/orders/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30