apiVersion: v1
kind: ConfigMap
metadata:
  name: order-service-configmap
  namespace: talabat
data:
  SPRING_DATASOURCE_URL: jdbc:postgresql://order-postgres:5432/talabatdb-orders
  SPRING_DATASOURCE_USERNAME: user
  SPRING_RABBITMQ_HOST: rabbitmq

  SPRING_NEO4J_URI: bolt://neo4j:7687
  SPRING_NEO4J_AUTHENTICATION_USERNAME: neo4j
  SPRING_NEO4J_AUTHENTICATION_PASSWORD: neo4jpass

  SPRING_RABBITMQ_HOST: rabbitmq
  SPRING_RABBITMQ_PORT: "5672"
  SPRING_RABBITMQ_USERNAME: guest
  SPRING_RABBITMQ_PASSWORD: guest
  SPRING_RABBITMQ_LISTENER_SIMPLE_ACKNOWLEDGE_MODE: auto
  SPRING_RABBITMQ_LISTENER_SIMPLE_DEFAULT_REQUEUE_REJECTED: "false"
  SPRING_RABBITMQ_LISTENER_SIMPLE_RETRY_ENABLED: "true"
  SPRING_RABBITMQ_LISTENER_SIMPLE_RETRY_INITIAL_INTERVAL: "1000"
  SPRING_RABBITMQ_LISTENER_SIMPLE_RETRY_MAX_ATTEMPTS: "3"

  FEIGN_USER_SERVICE_URL: http://user-service:8080
  FEIGN_RESTAURANT_SERVICE_URL: http://restaurant-service:8080
  FEIGN_DELIVERY_SERVICE_URL: http://delivery-service:8080
  FEIGN_CHECKOUT_SERVICE_URL: http://checkout-service:8080
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: prometheus,health,info
  LOGGING_LOKI_URL: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push

  MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: always