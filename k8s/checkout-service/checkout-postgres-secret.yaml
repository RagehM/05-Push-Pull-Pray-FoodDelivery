# [S5-READ-DB] Credentials for the isolated checkout-postgres instance.
# Values are base64-encoded (postgres / postgres / talabatdb-checkout).
apiVersion: v1
kind: Secret
metadata:
  name: checkout-postgres-secret
  namespace: talabat
  labels:
    app: checkout-postgres
    component: database
    feature: S5-READ-DB
type: Opaque
data:
  POSTGRES_USER: cG9zdGdyZXM=                  # postgres
  POSTGRES_PASSWORD: cG9zdGdyZXM=              # postgres
  POSTGRES_DB: dGFsYWJhdGRiLWNoZWNrb3V0        # talabatdb-checkout
