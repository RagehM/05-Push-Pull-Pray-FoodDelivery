  # S5-INFRA owner needs to fill this
  checkout-dashboard.json: |
    {
      "title": "checkout-service",
      "uid": "checkout-service",
      "schemaVersion": 38,
      "tags": ["s5", "checkout-service"],
      "timezone": "browser",
      "time": { "from": "now-1h", "to": "now" },
      "refresh": "15s",
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "[LogQL] Log Volume Rate by Level",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (level) (rate({app=\"talabat\", service=\"checkout-service\"} | json [5m]))"
            }
          ],
          "options": { "legend": { "displayMode": "table", "placement": "right" } }
        },
        {
          "id": 2,
          "type": "logs",
          "title": "[LogQL] Real-Time ERROR Logs",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "refId": "A",
              "expr": "{app=\"talabat\", service=\"checkout-service\", level=\"ERROR\"} | json"
            }
          ],
          "options": { "showTime": true, "wrapLogMessage": true, "dedupStrategy": "none" }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "[LogQL] Downstream Feign Outbound Failures",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate({app=\"talabat\", service=\"checkout-service\"} | json | message =~ \".*(Feign error|unavailable|Exception).*\" [1m]))"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "[LogQL] S5-F10 Analytics Traffic Monitor",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate({app=\"talabat\", service=\"checkout-service\"} | json | message =~ \".*HTTP GET /api/payments/user/.*/total.*\" [5m]))"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "[LogQL] S5-F4 Micro-Transaction Error Rate",
          "description": "Monitors spikes in ERROR logs per minute specific to payment processing.",
          "gridPos": { "x": 0, "y": 16, "w": 24, "h": 6 },
