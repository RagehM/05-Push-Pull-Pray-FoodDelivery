apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
data:
  # S1-INFRA owner needs to fill this
  user-dashboard.json: |
    {}
  # S2-INFRA owner needs to fill this
  restaurant-dashboard.json: |
    {}
  # S3-INFRA — order-service dashboard
  order-dashboard.json: |
    {
      "title": "order-service",
      "uid": "order-service",
      "schemaVersion": 38,
      "tags": ["s3", "order-service"],
      "timezone": "browser",
      "time": { "from": "now-1h", "to": "now" },
      "refresh": "15s",
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "[PromQL] HTTP Request Rate — /api/orders/**",
          "description": "Requests per second per endpoint. Identifies peak load on order-service endpoints.",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (uri, method, status) (rate(http_server_requests_seconds_count{job=\"order-service\"}[5m]))",
              "legendFormat": "{{method}} {{uri}} [{{status}}]"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps", "custom": { "lineWidth": 2 } } }
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "[PromQL] HTTP Latency P50 / P95 / P99",
          "description": "P99 latency on GET /api/orders/restaurant/{id}/summary is 4s — Feign enrichment is slow.",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.50, sum by (le, uri) (rate(http_server_requests_seconds_bucket{job=\"order-service\"}[5m])))",
              "legendFormat": "P50: {{uri}}"
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.95, sum by (le, uri) (rate(http_server_requests_seconds_bucket{job=\"order-service\"}[5m])))",
              "legendFormat": "P95: {{uri}}"
            },
            {
              "refId": "C",
              "expr": "histogram_quantile(0.99, sum by (le, uri) (rate(http_server_requests_seconds_bucket{job=\"order-service\"}[5m])))",
              "legendFormat": "P99: {{uri}}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "s", "custom": { "lineWidth": 2 } } }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "[PromQL] JVM Heap Memory Usage",
          "description": "Memory pressure before OOM — order-service heap growth after processing saga events.",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            {
              "refId": "A",
              "expr": "jvm_memory_used_bytes{job=\"order-service\", area=\"heap\"}",
              "legendFormat": "Heap Used — {{id}}"
            },
            {
              "refId": "B",
              "expr": "jvm_memory_max_bytes{job=\"order-service\", area=\"heap\"}",
              "legendFormat": "Heap Max — {{id}}"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "bytes", "custom": { "lineWidth": 2 } } }
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "[LogQL] Error Rate — order-service",
          "description": "Count of ERROR-level log lines per minute. Spike = saga failure or downstream service degradation.",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate({app=\"talabat\", service=\"order-service\", level=\"ERROR\"}[1m]))",
              "legendFormat": "Errors/min"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "short", "custom": { "lineWidth": 2 } } }
        },
        {
          "id": 5,
          "type": "logs",
          "title": "[LogQL] RabbitMQ Event Audit — order.events",
          "description": "Lines emitted by publishers/consumers filtered by order routing keys.",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 16 },
          "targets": [
            {
              "refId": "A",
              "expr": "{app=\"talabat\", service=\"order-service\"} | json | routingKey =~ \"order\\\\..*\""
            }
          ]
        },
        {
          "id": 6,
          "type": "logs",
          "title": "[LogQL] Saga State Transitions — Order Lifecycle",
          "description": "Visualize the complete saga flow: COMPLETING → PAYMENT_PENDING → PAID → DELIVERING → DELIVERED.",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 24 },
          "targets": [
            {
              "refId": "A",
              "expr": "{app=\"talabat\", service=\"order-service\"} | json | orderId != \"\" | message =~ \".*transitioning.*\" | line_format \"[{{.level}}] orderId={{.orderId}} — {{.message}}\""
            }
          ]
        }
      ]
    }
  # S4-INFRA owner needs to fill this
  delivery-dashboard.json: |
    {
      "id": null,
      "uid": "delivery-svc",
      "title": "Delivery Service",
      "tags": [
        "talabat",
        "delivery"],
      "timezone": "browser",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"},
      "panels": [
        {
          "id": 1,
          "title": "Error Rate",
          "description": "ERROR-level log lines per minute from delivery-service",
          "type": "timeseries",
          "datasource": {
            "type": "loki",
            "uid": "loki"},
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 8},
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate({app=\"talabat\", service=\"delivery-service\", level=\"ERROR\"}[1m]))",
              "legendFormat": "errors/min"
            }
          ]
        },
        {
          "id": 2,
          "title": "RabbitMQ Event Audit",
          "description": "Events published and consumed by delivery-service, filtered by routing key",
          "type": "logs",
          "datasource": {
            "type": "loki",
            "uid": "loki"},
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 8},
          "targets": [
            {
              "refId": "A",
              "expr": "{app=\"talabat\", service=\"delivery-service\"} | json | routingKey =~ `delivery\\..+|order\\..+`"
            }
          ]
        },
        {
          "id": 3,
          "title": "Saga Tracking — delivery lifecycle by orderId",
          "description": "Traces the complete delivery saga flow filtered by orderId",
          "type": "logs",
          "datasource": {
            "type": "loki",
            "uid": "loki"},
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 24,
            "h": 8},
          "targets": [
            {
              "refId": "A",
              "expr": "{app=\"talabat\", service=\"delivery-service\"} | json | orderId != \"\" | line_format \"[{{.level}}] orderId={{.orderId}} deliveryId={{.deliveryId}} status={{.status}} — {{.message}}\""
            }
          ]
        },
        {
          "id": 4,
          "title": "HTTP Request Rate",
          "description": "Requests per second per endpoint",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"},
          "gridPos": {
            "x": 0,
            "y": 16,
            "w": 8,
            "h": 8},
          "targets": [
            {
              "refId": "A",
              "expr": "rate(http_server_requests_seconds_count{job=\"delivery-service\"}[5m])",
              "legendFormat": "{{method}} {{uri}}"
            }
          ]
        },
        {
          "id": 5,
          "title": "HTTP Latency P99",
          "description": "P99 request latency per endpoint",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"},
          "gridPos": {
            "x": 8,
            "y": 16,
            "w": 8,
            "h": 8},
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.99, rate(http_server_requests_seconds_bucket{job=\"delivery-service\"}[5m]))",
              "legendFormat": "P99"
            }
          ]
        },
        {
          "id": 6,
          "title": "HikariCP Active Connections",
          "description": "Active database connections from the connection pool",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"},
          "gridPos": {
            "x": 16,
            "y": 16,
            "w": 8,
            "h": 8},
          "targets": [
            {
              "refId": "A",
              "expr": "hikaricp_connections_active{job=\"delivery-service\"}",
              "legendFormat": "Active"
            }
          ]
        }
      ]
    }
  # S5-INFRA owner needs to fill this
  checkout-dashboard.json: |
    {
      "title": "checkout-service",
      "uid": "checkout-service",
      "schemaVersion": 38,
      "tags": ["s5", "checkout-service"],
      "timezone": "browser",
      "time": { "from": "now-1h", "to": "now" },
      "refresh": "15s",
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "[LogQL] Log Volume Rate by Level",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (level) (rate({app=\"talabat\", service=\"checkout-service\"} | json [5m]))"
            }
          ],
          "options": { "legend": { "displayMode": "table", "placement": "right" } }
        },
        {
          "id": 2,
          "type": "logs",
          "title": "[LogQL] Real-Time ERROR Logs",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "refId": "A",
              "expr": "{app=\"talabat\", service=\"checkout-service\", level=\"ERROR\"} | json"
            }
          ],
          "options": { "showTime": true, "wrapLogMessage": true, "dedupStrategy": "none" }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "[LogQL] Downstream Feign Outbound Failures",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate({app=\"talabat\", service=\"checkout-service\"} | json | message =~ \".*(Feign error|unavailable|Exception).*\" [1m]))"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "[LogQL] S5-F10 Analytics Traffic Monitor",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate({app=\"talabat\", service=\"checkout-service\"} | json | message =~ \".*HTTP GET /api/payments/user/.*/total.*\" [5m]))"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "[LogQL] S5-F4 Micro-Transaction Error Rate",
          "description": "Monitors spikes in ERROR logs per minute specific to payment processing.",
          "gridPos": { "x": 0, "y": 16, "w": 24, "h": 6 },
          "datasource": { "type": "loki", "uid": "loki" },
          "targets": [
            {
              "expr": "sum(rate({app=\"talabat\", service=\"checkout-service\", level=\"ERROR\"}[1m]))",
              "legendFormat": "Errors/min",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": { "lineWidth": 2 }
            }
          }
        },
        {
          "id": 6,
          "type": "logs",
          "title": "[LogQL] RabbitMQ Event Audit — payment.events",
          "description": "Lines emitted by saga publishers and consumers filtered by payment routing keys.",
          "gridPos": { "x": 0, "y": 22, "w": 24, "h": 8 },
          "datasource": { "type": "loki", "uid": "loki" },
          "targets": [
            {
              "expr": "{app=\"talabat\", service=\"checkout-service\"} | json | routingKey =~ \"payment\\\\..*\"",
              "legendFormat": "",
              "refId": "A"
            }
          ]
        },
        {
          "id": 7,
          "type": "logs",
          "title": "[LogQL] Saga State Transitions — Order Journey Trace",
          "description": "Filter all payment saga log lines by orderId to trace the complete transaction flow.",
          "gridPos": { "x": 0, "y": 30, "w": 24, "h": 8 },
          "datasource": { "type": "loki", "uid": "loki" },
          "targets": [
            {
              "expr": "{app=\"talabat\", service=\"checkout-service\"} | json | orderId != \"\" | line_format \"[{{.level}}] orderId={{.orderId}} paymentId={{.paymentId}} routingKey={{.routingKey}} — {{.message}}\"",
              "legendFormat": "",
              "refId": "A"
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "[PromQL] HTTP Server Latency Percentiles (S5-F4 & S5-F10)",
          "description": "P95 and P99 response durations across endpoints to track processing delays.",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 38 },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{service=\"checkout-service\"}[5m])) by (le, uri))",
              "legendFormat": "P95: {{uri}}",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.99, sum(rate(http_server_requests_seconds_bucket{service=\"checkout-service\"}[5m])) by (le, uri))",
              "legendFormat": "P99: {{uri}}",
              "refId": "B"
            }
          ]
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "[PromQL] HikariCP Connection Pool Connection Allocation",
          "description": "Active vs Max pool metrics tracking database saturation under concurrent SELECT FOR UPDATE locks.",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 38 },
          "targets": [
            {
              "expr": "hikaricp_connections_active{service=\"checkout-service\"}",
              "legendFormat": "Active DB Connections",
              "refId": "A"
            },
            {
              "expr": "hikaricp_connections_max{service=\"checkout-service\"}",
              "legendFormat": "Max Limit Pool Size",
              "refId": "B"
            }
          ]
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "[PromQL] RabbitMQ Event Throughput — payment.saga-listener Queue",
          "description": "Live production processing throughput monitoring counter increments from Actuator.",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 46 },
          "targets": [
            {
              "expr": "sum(rate(rabbitmq_messages_published_total{queue=\"payment.saga-listener\"}[5m]))",
              "legendFormat": "Published/sec",
              "refId": "A"
            },
            {
              "expr": "sum(rate(rabbitmq_messages_delivered_total{queue=\"payment.saga-listener\"}[5m]))",
              "legendFormat": "Consumed & Processed/sec",
              "refId": "B"
            }
          ]
        }
      ]
    }