apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cassandra
  namespace: talabat
spec:
  serviceName: cassandra
  replicas: 1
  selector:
    matchLabels:
      app: cassandra
  template:
    metadata:
      labels:
        app: cassandra
    spec:
      containers:
        - name: cassandra
          image: cassandra:latest
          ports:
            - containerPort: 9042
          env:
            - name: CASSANDRA_CLUSTER_NAME
              value: fooddeliverycluster
            - name: CASSANDRA_DC
              value: datacenter1
            - name: MAX_HEAP_SIZE
              value: 512M
            - name: HEAP_NEWSIZE
              value: 128M
          volumeMounts:
            - name: data
              mountPath: /var/lib/cassandra
          readinessProbe:
            exec:
              command:
                - cqlsh
                - -e
                - "DESCRIBE KEYSPACES"
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ['ReadWriteOnce']
        resources:
          requests:
            storage: 2Gi
