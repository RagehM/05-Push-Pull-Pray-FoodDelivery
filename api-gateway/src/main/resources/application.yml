server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: http://user-service:8080
              predicates:
                - Path=/api/users/**, /api/auth/**, /api/delivery-addresses/**

            - id: restaurant-service
              uri: http://restaurant-service:8080
              predicates:
                - Path=/api/restaurants/**, /api/menu-items/**

            - id: order-service
              uri: http://order-service:8080
              predicates:
                - Path=/api/orders/**, /api/order-items/**

            - id: delivery-service
              uri: http://delivery-service:8080
              predicates:
                - Path=/api/deliveries/**

            - id: checkout-service
              uri: http://checkout-service:8080
              predicates:
                - Path=/api/payments/**, /api/offers/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
