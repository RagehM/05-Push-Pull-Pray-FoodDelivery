spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # S1-INFRA owner needs to fill this
        
        # S2-INFRA: restaurant-service routes
        - id: restaurant-service
          uri: http://restaurant-service.talabat.svc.cluster.local:8080
          predicates:
            - Path=/api/restaurants/**
        
        # S3-INFRA owner needs to fill this
        
        - id: delivery-service
          uri: http://delivery-service:8080
          predicates:
            - Path=/api/deliveries/**
        
        # S5-INFRA owner needs to fill this