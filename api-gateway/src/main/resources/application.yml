server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: http://user-service:8080
              predicates:
                - Path=/api/users/**, /api/auth/**, /api/delivery-addresses/**
            #        # S2-INFRA owner needs to fill this
            #
            #        # S3-INFRA owner needs to fill this
            #
            #        # S4-INFRA owner needs to fill this
            - id: delivery-service
              uri: http://delivery-service:8080
              predicates:
                - Path=/api/deliveries/**
            #        # S5-INFRA owner needs to fill this

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway