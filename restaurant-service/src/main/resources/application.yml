server:
  port: 8080

spring:
  application:
    name: restaurant-service

  datasource:
    url: jdbc:postgresql://restaurant-postgres:5432/talabatdb-restaurants
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  elasticsearch:
    uris: http://elasticsearch:9200

  data:
    redis:
      host: redis
      port: 6379
      password: redispass

  mongodb:
    uri: mongodb://root:rootpass@mongo:27017/fooddeliverymongo?authSource=admin

  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1000
          max-retries: 3
    #          max-attempts: 3

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

feign:
  order-service:
    url: http://order-service:8080

management:
  endpoints:
    web:
      exposure:
        include: "prometheus,health,info"
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

