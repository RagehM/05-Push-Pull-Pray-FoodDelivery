server:
  port: 8080

spring:
  application:
    name: restaurant-service

  datasource:
    url: jdbc:postgresql://postgres:5432/fooddeliverydb
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  elasticsearch:
    uris: http://elasticsearch:9200

  data:
    redis:
      host: redis
      port: 6379
      password: redispass

  mongodb:
    uri: mongodb://root:rootpass@mongo:27017/fooddeliverymongo?authSource=admin
    
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

