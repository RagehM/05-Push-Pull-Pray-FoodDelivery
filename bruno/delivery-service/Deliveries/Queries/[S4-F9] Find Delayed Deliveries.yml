info:
  name: "[S4-F9] Find Delayed Deliveries"
  type: http
  seq: 8

http:
  method: GET
  url: "{{DELIVERY_SERVICE_URL}}/api/deliveries/delayed?maxEstimatedArrival=45.0&sinceMinutes=30"
  headers:
    - name: Authorization
      value: Bearer {{authToken}}
  params:
    - name: maxEstimatedArrival
      value: "45.0"
      type: query
    - name: sinceMinutes
      value: "30"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
