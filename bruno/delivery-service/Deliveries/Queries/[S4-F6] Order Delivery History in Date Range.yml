info:
  name: "[S4-F6] Order Delivery History in Date Range"
  type: http
  seq: 5

http:
  method: GET
  url: "{{DELIVERY_SERVICE_URL}}/api/deliveries/order/1/history?startDate=2026-01-01&endDate=2026-04-30"
  headers:
    - name: Authorization
      value: Bearer {{authToken}}
  params:
    - name: startDate
      value: 2026-01-01
      type: query
    - name: endDate
      value: 2026-04-30
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("order history returns array or 404", function () {
          const status = res.getStatus();
          expect(status).to.not.equal(500);
          if (status === 200) {
            const body = res.getBody();
            expect(body).to.be.an('array');
          }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
