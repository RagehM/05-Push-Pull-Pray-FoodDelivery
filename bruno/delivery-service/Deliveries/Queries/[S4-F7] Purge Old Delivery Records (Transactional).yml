info:
  name: "[S4-F7] Purge Old Delivery Records (Transactional)"
  type: http
  seq: 6

http:
  method: DELETE
  url: "{{DELIVERY_SERVICE_URL}}/api/deliveries/purge?olderThanDays=90"
  headers:
    - name: Authorization
      value: Bearer {{authToken}}
  params:
    - name: olderThanDays
      value: "90"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
