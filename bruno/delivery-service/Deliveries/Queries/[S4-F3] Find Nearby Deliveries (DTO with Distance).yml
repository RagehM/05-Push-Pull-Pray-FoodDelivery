info:
  name: "[S4-F3] Find Nearby Deliveries (DTO with Distance)"
  type: http
  seq: 3

http:
  method: GET
  url: "{{DELIVERY_SERVICE_URL}}/api/deliveries/nearby?lat=48.8566&lon=2.3522&radiusKm=5"
  headers:
    - name: Authorization
      value: Bearer {{authToken}}
  params:
    - name: lat
      value: "48.8566"
      type: query
    - name: lon
      value: "2.3522"
      type: query
    - name: radiusKm
      value: "5"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
