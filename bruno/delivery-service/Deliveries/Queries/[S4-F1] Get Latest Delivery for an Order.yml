info:
  name: "[S4-F1] Get Latest Delivery for an Order"
  type: http
  seq: 1

http:
  method: GET
  url: "{{DELIVERY_SERVICE_URL}}/api/deliveries/order/1/latest"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("get latest delivery returns 200 with id or 404 if none", function () {
          const status = res.getStatus();
          expect([200, 404]).to.include(status);
          if (status === 200) {
            const body = res.getBody();
            expect(body).to.have.property('id');
          }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
