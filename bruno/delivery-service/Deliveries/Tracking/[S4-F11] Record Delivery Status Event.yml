info:
  name: "[S4-F11] Record Delivery Status Event"
  type: http
  seq: 11

http:
  method: POST
  url: "{{DELIVERY_SERVICE_URL}}/api/deliveries/{{Last_Delivery_Id}}/tracking"
  body:
    type: json
    data: |-
      {
        "status": "PICKED_UP",
        "latitude": 30.0444,
        "longitude": 31.2357,
        "notes": "Picked up from restaurant"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const axios = require('axios');

        const baseUrl    = bru.getEnvVar("DELIVERY_SERVICE_URL");
        const token      = bru.getEnvVar("AUTH_TOKEN");
        const deliveryId = bru.getEnvVar("Last_Delivery_Id");

        // ─── Prerequisites guard ──────────────────────────────────────────────────────
        test("[S4-F11] Prerequisites: env vars must be configured", function () {
          expect(baseUrl,    "DELIVERY_SERVICE_URL is not set").to.exist;
          expect(token,      "AUTH_TOKEN is not set").to.exist;
          expect(deliveryId, "Last_Delivery_Id is not set — run CreateDelivery first").to.exist;
          expect(deliveryId).to.not.equal("").and.not.equal("undefined");
        });

        // ─── Scenario (a): PICKED_UP → 201 ───────────────────────────────────────────
        test("[S4-F11a] PICKED_UP tracking event returns 201", function () {
          expect(res.getStatus()).to.equal(201);
        });

        test("[S4-F11a] Response body is empty or void on 201", function () {
          const body = res.getBody();
          const isEmpty =
            body === null ||
            body === undefined ||
            body === "" ||
            (typeof body === "object" && Object.keys(body).length === 0);
          expect(isEmpty).to.equal(true);
        });

        // ─── Scenario (b): IN_TRANSIT → 201 ──────────────────────────────────────────
        let inTransitStatus;
        try {
          const inTransitRes = await axios.post(
            `${baseUrl}/api/deliveries/${deliveryId}/tracking`,
            {
              status: "IN_TRANSIT",
              latitude: 30.0600,
              longitude: 31.2500,
              notes: "En route to customer",
            },
            {
              headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${token}`,
              },
              validateStatus: () => true,
            }
          );
          inTransitStatus = inTransitRes.status;
        } catch (e) {
          console.error(e);
          inTransitStatus = null;
        }

        test("[S4-F11b] IN_TRANSIT tracking event returns 201", function () {
          expect(inTransitStatus).to.equal(201);
        });

        // ─── Scenario (c): unknown delivery ID ───────────────────────────────────────
        let notFoundStatus;
        try {
          const notFoundRes = await axios.post(
            `${baseUrl}/api/deliveries/999/tracking`,
            { status: "PICKED_UP", latitude: 30.0444, longitude: 31.2357 },
            {
              headers: { "Authorization": `Bearer ${token}` },
              validateStatus: (status) => status < 500 // Only throw on server errors
            }
          );
          notFoundStatus = notFoundRes.status;
        } catch (e) {
          // If Axios throws, the status is hidden inside e.response
          notFoundStatus = e.response ? e.response.status : null;
        }

        test("[S4-F11c] Non-existent delivery ID returns 404", function () {
          expect(notFoundStatus).to.equal(404);
        });

        // ─── Scenario (d): missing token ───────────────────────────────────────
        let unauthStatus;
        try {
          const unauthRes = await axios.post(
            `${baseUrl}/api/deliveries/${deliveryId}/tracking`,
            { status: "PICKED_UP", latitude: 30.0444, longitude: 31.2357 },
            {
              headers: { "Content-Type": "application/json" }, // No token
              validateStatus: (status) => status < 500
            }
          );
          unauthStatus = unauthRes.status;
        } catch (e) {
          unauthStatus = e.response ? e.response.status : null;
        }

        test("[S4-F11d] Missing JWT returns 401", function () {
          expect(unauthStatus).to.equal(401);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
