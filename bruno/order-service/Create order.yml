info:
  name: Create order
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8083/api/orders
  body:
    type: json
    data: |-
      {
        "userId": 3,
        "restaurantId": 1,
        "deliveryAddress": "123 Nile Street, Giza, Egypt",
        "status": "CONFIRMED",
        "totalAmount": 1500,
        "metadata": {
          "notes": "No onions please",
          "paymentMethod": "cash_on_delivery"
        },
        "orderDate": "2026-04-08T14:30:00"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
