info:
  name: Find Users By Dietary Preference and Minimum Orders
  type: http
  seq: 3

http:
  method: GET
  url: http://localhost:8081/api/users/preferences/dietary?diet=&minOrders=1
  params:
    - name: diet
      value: ""
      type: query
    - name: minOrders
      value: "1"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
